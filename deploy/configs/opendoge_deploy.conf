# OpenDoge deploy runtime config — matched to LainLab mjlab training.
# Units: rad, rad/s, Nm, second.

inference_hz=100
target_hz=200
# 一传三线束 + USB-CAN 适配器在高频时仍可能 burst 丢包；bringup 先用
# 100 Hz。当前硬件是 CHIWU 4×CAN 原生 can0-can3，后续可测 200 Hz。
control_hz=100
# PD gains matching LainLab BuiltinPositionActuatorCfg(stiffness=12.0, damping=0.5)
kp=12.0
kd=0.5
safe_kd=2.0
# Action scale matching training JointPositionActionCfg.scale=0.25
action_scale=0.25

# EL05 硬件力矩上限 (0x700B, 0 = 不写，保持电机默认)。
# 首次上机建议 3-4 Nm；这是真正限制输出力矩的旋钮。
# 注意 torque_threshold 只是安全报警阈值，不是限幅器。
torque_limit_nm=0.0
# EL05 CAN watchdog 0x7028 canTimeout (seconds; 0 = leave unchanged).
# Written RAM-only at deploy startup and read back per motor. If a motor
# receives no CAN command for this long (adapter/USB dead / deploy crash /
# COMM_STOP lost), it resets and stops applying torque. Must be 0 or >= 0.5;
# 1.0 is used during bring-up. Writing this does not touch motor Flash.
can_timeout_s=1.0
# base_lin_vel source for the 48-dim actor observation:
#   zero    — no state estimate (worst case)
#   command — body-frame velocity command approximation
#   imu     — read optional vx/vy/vz from /tmp/opendoge_imu.state
lin_vel_source=zero
# 反馈超时：100 Hz 下 0.1 s = 10 帧，给 USB-CAN burst 留余量。
# 若换成更稳定的适配器/更高 control_hz，可改回 0.02-0.05。
state_timeout_s=0.1
# 反馈补扫：某关节反馈快过期时主动发 READ_PARAM(mechPos/mechVel)，
# type-17 回包也计为有效反馈。50 Hz、每轮最多补 3 个关节，避免压垮适配器。
feedback_retry_hz=50
over_temperature_c=80.0
fault_poll_hz=10

# Position control startup: ramp kp/kd from damping to full PD over N seconds
pc_startup_ramp_s=2.0
# Max allowed joint deviation from default_pos at startup (rad). Faults if exceeded.
pc_startup_max_deviation=0.25
# LowGainTest 起立目标每 tick 最大步长 (rad)。200 Hz 下 0.002 = 0.4 rad/s，
# 从趴伏到站立约 2.6 s。进入 LowGainTest 时目标从实测位姿开始。
low_gain_max_position_step=0.002
# 从趴伏/远离站姿的位姿起身（不跑策略）：目标每 tick 最大步长，以及总时长。
# 200 Hz 下 0.002 = 0.4 rad/s；小腿 1.03 rad 约 2.6 s，4 s 留余量。
standup_max_position_step=0.002
standup_duration_s=4.0
# 起立阶段目标在斜坡上移动，允许更大的跟踪误差（位置误差，不是速度）。
standup_tracking_error_threshold=1.0
standup_tracking_error_timeout_s=0.8

# max_position_step is applied at 200 Hz.
# 0.015 rad/step = 3 rad/s target slew limit.

# Physical joint limits from OpenDoge URDF.
# Hip: FL/RL [-0.785, 0.26], FR/RR [-0.26, 0.785]
# Thigh: [-0.785, 1.134]
# Calf: [-2.68, -1.04] (always bent >= 60°)

joint.FL_hip_joint.direction=-1
joint.FL_hip_joint.offset=0.0000
# 髋/大腿无外部减速器，必须显式写 1.0（兜底表错位的旧 bug 会让它变成 -0.785）
joint.FL_hip_joint.reduction=1.0
joint.FL_hip_joint.lower=-0.785
joint.FL_hip_joint.upper=0.26
joint.FL_hip_joint.max_position_step=0.015

joint.FL_thigh_joint.direction=1
joint.FL_thigh_joint.offset=-0.8000
joint.FL_thigh_joint.reduction=1.0
joint.FL_thigh_joint.lower=-0.785
joint.FL_thigh_joint.upper=1.134
joint.FL_thigh_joint.max_position_step=0.015

joint.FL_calf_joint.direction=1
joint.FL_calf_joint.offset=1.6000
joint.FL_calf_joint.reduction=1.5
joint.FL_calf_joint.lower=-2.68
joint.FL_calf_joint.upper=-1.04
joint.FL_calf_joint.max_position_step=0.015

joint.FR_hip_joint.direction=-1
joint.FR_hip_joint.offset=0.0000
joint.FR_hip_joint.reduction=1.0
joint.FR_hip_joint.lower=-0.26
joint.FR_hip_joint.upper=0.785
joint.FR_hip_joint.max_position_step=0.015

joint.FR_thigh_joint.direction=-1
joint.FR_thigh_joint.offset=0.8000
joint.FR_thigh_joint.reduction=1.0
joint.FR_thigh_joint.lower=-0.785
joint.FR_thigh_joint.upper=1.134
joint.FR_thigh_joint.max_position_step=0.015

joint.FR_calf_joint.direction=-1
joint.FR_calf_joint.offset=-1.6000
joint.FR_calf_joint.reduction=1.5
joint.FR_calf_joint.lower=-2.68
joint.FR_calf_joint.upper=-1.04
joint.FR_calf_joint.max_position_step=0.015

joint.RL_hip_joint.direction=1
joint.RL_hip_joint.offset=0.0000
joint.RL_hip_joint.reduction=1.0
joint.RL_hip_joint.lower=-0.785
joint.RL_hip_joint.upper=0.26
joint.RL_hip_joint.max_position_step=0.015

joint.RL_thigh_joint.direction=1
joint.RL_thigh_joint.offset=-0.8000
joint.RL_thigh_joint.reduction=1.0
joint.RL_thigh_joint.lower=-0.785
joint.RL_thigh_joint.upper=1.134
joint.RL_thigh_joint.max_position_step=0.015

joint.RL_calf_joint.direction=1
joint.RL_calf_joint.offset=1.6000
joint.RL_calf_joint.reduction=1.5
joint.RL_calf_joint.lower=-2.68
joint.RL_calf_joint.upper=-1.04
joint.RL_calf_joint.max_position_step=0.015

joint.RR_hip_joint.direction=1
joint.RR_hip_joint.offset=0.0000
joint.RR_hip_joint.reduction=1.0
joint.RR_hip_joint.lower=-0.26
joint.RR_hip_joint.upper=0.785
joint.RR_hip_joint.max_position_step=0.015

joint.RR_thigh_joint.direction=-1
joint.RR_thigh_joint.offset=0.8000
joint.RR_thigh_joint.reduction=1.0
joint.RR_thigh_joint.lower=-0.785
joint.RR_thigh_joint.upper=1.134
joint.RR_thigh_joint.max_position_step=0.015

joint.RR_calf_joint.direction=-1
joint.RR_calf_joint.offset=-1.6000
joint.RR_calf_joint.reduction=1.5
joint.RR_calf_joint.lower=-2.68
joint.RR_calf_joint.upper=-1.04
joint.RR_calf_joint.max_position_step=0.015

# ── Per-joint torque safety threshold (joint-side, N·m) ──────
# EL05 hardware limit is 6 N·m (motor side). calf reduction=1.5, so
# 4.0 N·m joint-side = 2.67 N·m motor-side. Raised from the 3.0 default
# because FR_calf is mechanically tighter and tripped during stand-up
# (joint-side 3.09 N·m). max_torque > 0 overrides the global torque_threshold.
joint.FL_hip_joint.max_torque=4.0
joint.FL_thigh_joint.max_torque=4.0
joint.FL_calf_joint.max_torque=6.0
joint.FR_hip_joint.max_torque=4.0
joint.FR_thigh_joint.max_torque=4.0
joint.FR_calf_joint.max_torque=6.0
joint.RL_hip_joint.max_torque=4.0
joint.RL_thigh_joint.max_torque=4.0
joint.RL_calf_joint.max_torque=6.0
joint.RR_hip_joint.max_torque=4.0
joint.RR_thigh_joint.max_torque=4.0
joint.RR_calf_joint.max_torque=6.0

# ── Safety monitoring thresholds ──────────────────────────
# Sustained torque exceedance (Nm, seconds)
torque_threshold=4.0
torque_timeout_s=0.5
# Joint tracking error (rad, seconds) — only Active/LowGainTest
tracking_error_threshold=0.5
tracking_error_timeout_s=0.3
# Stale command file detection (seconds)
command_timeout_s=0.5
# IMU-based fall detection (gravity.z threshold, timeout)
fall_gravity_z_threshold=0.3
fall_timeout_s=0.3
# LowGainTest 起立阶段暂停 IMU 倒地检测的时长（秒）。趴伏 gz≈0 不会立刻触发；
# 超过后重新启用，起立失败仍会 fault。
standup_grace_s=5.0
# WaitFeedback overall timeout (0 = no timeout)
feedback_wait_timeout_s=5.0
# Early temperature warning threshold (C)
temp_warn_c=65.0
# IMU consecutive invalid reads before dropping to Ready (debounce)
imu_debounce_count=10

# ── Command processing ────────────────────────────────────
# EMA smoothing alpha: 0=disabled, 0.05-0.2 for real use
command_smoothing_alpha=0.05
